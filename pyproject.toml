[project]
name = "sims-face-scan"
version = "0.2.0"
description = "Recreate a real person's face in The Sims 4 using only the game's own CAS sculpts and modifiers"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
